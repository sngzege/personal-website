<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Notes — Ege Şengöz</title>
    <meta name="description" data-i18n-content="blog_meta" content="Field notes from Ege Şengöz on machine monitoring, ISO audits, fixture design, production scheduling and internal tools." />
    <meta name="theme-color" content="#0e1013" />
    <link rel="icon" href="../public/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="site" data-page="blog" data-title-key="blog_title" id="top">

    <header data-site-header></header>

    <main>
        <section class="hero drafting" style="padding-bottom:clamp(32px,4vw,48px)">
            <div class="wrap stack">
                <span class="eyebrow" data-i18n="blog_eyebrow">Notes</span>
                <h1 class="h-page" data-i18n="blog_h1">Field notes from the shop floor.</h1>
                <p class="lead" data-i18n="blog_lead">Working notes on machine monitoring, audits, fixtures, scheduling and internal tools. Most are drafts; full write-ups appear here as they're finished.</p>
            </div>
        </section>

        <section style="padding-bottom:clamp(64px,9vw,112px)">
            <div class="wrap stack-lg">
                <div class="filters" id="filters" role="group" data-i18n-aria="filter_label" aria-label="Filter notes"></div>
                <div class="note-list" id="notes"></div>
            </div>
        </section>
    </main>

    <footer data-site-footer></footer>

    <script src="../js/portfolio.js"></script>
    <script src="../data/blog.js"></script>
    <script>
        const i18n = {
            en: {
                blog_title: "Notes — Ege Şengöz",
                blog_meta: "Field notes from Ege Şengöz on machine monitoring, ISO audits, fixture design, production scheduling and internal tools.",
                blog_eyebrow: "Notes",
                blog_h1: "Field notes from the shop floor.",
                blog_lead: "Working notes on machine monitoring, audits, fixtures, scheduling and internal tools. Most are drafts; full write-ups appear here as they're finished.",
                filter_label: "Filter notes",
                all: "All", wip: "In progress", news: "Industry notes", idea: "Ideas", update: "Updates",
                empty: "Nothing here yet."
            },
            tr: {
                blog_title: "Notlar — Ege Şengöz",
                blog_meta: "Ege Şengöz'den makine izleme, ISO denetimleri, fikstür tasarımı, üretim çizelgeleme ve iç araçlar üzerine saha notları.",
                blog_eyebrow: "Notlar",
                blog_h1: "Sahadan notlar.",
                blog_lead: "Makine izleme, denetimler, fikstürler, çizelgeleme ve iç araçlar üzerine çalışma notları. Çoğu taslak; tamamlanan yazılar burada yayımlanacak.",
                filter_label: "Notları filtrele",
                all: "Tümü", wip: "Devam ediyor", news: "Sektör notları", idea: "Fikirler", update: "Güncellemeler",
                empty: "Henüz bir şey yok."
            }
        };
        const CATS = ["wip", "news", "idea", "update"];
        const esc = PortfolioApp.escapeHtml;
        let filter = "all";

        function render(lang) {
            const t = i18n[lang];
            const cats = ["all"].concat(CATS.filter((c) => blogPosts.some((p) => p.category === c)));
            document.getElementById("filters").innerHTML = cats.map((c) => {
                const n = c === "all" ? blogPosts.length : blogPosts.filter((p) => p.category === c).length;
                return `<button type="button" class="filter" data-filter="${c}" aria-pressed="${c === filter}">${t[c]} <span class="filter__count">${n}</span></button>`;
            }).join("");
            const list = filter === "all" ? blogPosts : blogPosts.filter((p) => p.category === filter);
            document.getElementById("notes").innerHTML = list.length ? list.map((p) => {
                const d = p[lang] || p.en;
                const status = p.status ? (p.status[lang] || p.status.en) : t[p.category];
                const read = p.readTime ? (p.readTime[lang] || p.readTime.en) : "";
                return `
                    <article class="note">
                        <span class="note__date">${esc(p.date)}</span>
                        <div class="note__body">
                            <h2 class="h-card">${esc(d.title)}</h2>
                            <p class="note__excerpt">${esc(d.excerpt)}</p>
                            <div class="chips">${(p.tags || []).slice(0, 4).map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>
                        </div>
                        <div class="stack-sm" style="justify-items:end">
                            <span class="status status--${esc(p.category)}">${esc(status)}</span>
                            ${read ? `<span class="mono small muted">${esc(read)}</span>` : ""}
                        </div>
                    </article>`;
            }).join("") : `<p class="empty">${t.empty}</p>`;
        }
        document.getElementById("filters").addEventListener("click", (e) => {
            const b = e.target.closest("[data-filter]");
            if (!b) return;
            filter = b.getAttribute("data-filter");
            render(PortfolioApp.getLang());
        });
        PortfolioApp.registerPageTranslations(i18n);
        PortfolioApp.onLanguageChange(render);
    </script>
</body>
</html>
