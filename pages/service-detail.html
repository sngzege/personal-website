<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Service — Ege Şengöz</title>
    <meta name="description" content="Engineering service detail — Ege Şengöz" />
    <meta name="theme-color" content="#0e1013" />
    <link rel="icon" href="../public/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="site" data-page="solutions" id="top">

    <header data-site-header></header>

    <main id="page-content"></main>

    <footer data-site-footer></footer>

    <script src="../js/portfolio.js"></script>
    <script src="../data/services.js"></script>
    <script src="../data/projects.js"></script>
    <script>
        const RELATED = {
            "custom-machine-design": ["suitcase-assembly-machines", "adjustable-curved-roller"],
            "static-dynamic-analysis": ["adjustable-curved-roller", "suitcase-assembly-machines"],
            "iso-certification-consultancy": ["maliyetanaliiz", "synccore"],
            "software-development": ["production-data-app", "ai-production-planning", "arge-kanban"],
            "iot-digital-transformation": ["edgepulse-iot", "production-data-app"],
            "data-analysis-solutions": ["maliyetanaliiz", "ai-erp-assistant", "drive-assist"]
        };
        const i18n = {
            en: {
                back: "All solutions",
                scope: "What's included",
                related: "Related work",
                ask: "Request this service",
                ask_p: "Opens the contact form with this service selected.",
                not_found_title: "Service not found",
                not_found_p: "The link may be out of date. All services are on the solutions page."
            },
            tr: {
                back: "Tüm çözümler",
                scope: "Kapsam",
                related: "İlgili çalışmalar",
                ask: "Bu hizmeti talep et",
                ask_p: "İletişim formunu bu hizmet seçili olarak açar.",
                not_found_title: "Hizmet bulunamadı",
                not_found_p: "Bağlantı güncel olmayabilir. Tüm hizmetler çözümler sayfasında."
            }
        };
        const esc = PortfolioApp.escapeHtml;
        const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';

        function render(lang) {
            const t = i18n[lang];
            const id = new URLSearchParams(location.search).get("id");
            const service = servicesData.find((s) => s.id === id);
            const host = document.getElementById("page-content");
            if (!service) {
                host.innerHTML = `<section class="hero drafting"><div class="wrap stack">
                    <a class="crumb" href="engineering-solutions.html">${ICON_BACK}${t.back}</a>
                    <h1 class="h-page">${t.not_found_title}</h1><p class="lead">${t.not_found_p}</p></div></section>`;
                return;
            }
            const d = service[lang] || service.en;
            const related = (RELATED[service.id] || []).map((pid) => projectsData.find((p) => p.id === pid)).filter(Boolean);
            host.innerHTML = `
                <section class="hero drafting" style="padding-bottom:clamp(40px,5vw,64px)">
                    <div class="wrap stack-lg">
                        <a class="crumb" href="engineering-solutions.html">${ICON_BACK}${t.back}</a>
                        <div class="stack">
                            ${d.badge ? `<span class="svc__badge">${esc(d.badge)}</span>` : ""}
                            <h1 class="h-page">${esc(d.title)}</h1>
                            <p class="lead">${esc(d.description)}</p>
                        </div>
                    </div>
                </section>
                <section class="section">
                    <div class="wrap split">
                        <div class="stack-lg">
                            <div class="prose"><p>${esc(d.detailDescription)}</p></div>
                            <div class="stack">
                                <span class="eyebrow">${t.scope}</span>
                                <ul class="ticks">${(d.highlights || []).map((h) => `<li>${esc(h)}</li>`).join("")}</ul>
                            </div>
                        </div>
                        <aside class="panel stack split__aside" style="align-self:start">
                            <h2 class="h-card">${t.ask}</h2>
                            <p class="small muted">${t.ask_p}</p>
                            <div><a class="btn btn--primary" href="contact.html?service=${encodeURIComponent(service.id)}">${t.ask}</a></div>
                        </aside>
                    </div>
                </section>
                ${related.length ? `
                <section class="section">
                    <div class="wrap stack-lg">
                        <span class="eyebrow">${t.related}</span>
                        <div class="project-grid">${related.map((p) => PortfolioApp.projectCard(p, lang)).join("")}</div>
                    </div>
                </section>` : ""}`;
            document.title = `${d.title} — Ege Şengöz`;
            const meta = document.querySelector('meta[name="description"]');
            if (meta) meta.setAttribute("content", d.description);
        }
        PortfolioApp.registerPageTranslations(i18n);
        PortfolioApp.onLanguageChange(render);
    </script>
</body>
</html>
