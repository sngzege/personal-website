<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Project — Ege Şengöz</title>
    <meta name="description" content="Project detail — Ege Şengöz" />
    <meta name="theme-color" content="#0e1013" />
    <link rel="icon" href="../public/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" />
    <link rel="stylesheet" href="../css/main.css" />
    <style>
        .detail-hero__grid {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
            gap: clamp(32px, 6vw, 72px);
            align-items: end;
        }
        .detail-hero__grid > * { min-width: 0; }
        .detail-figure {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: end;
            gap: 16px;
            padding: 24px;
            min-height: 200px;
            border: 1px solid var(--line-strong);
            border-radius: var(--radius);
            background-color: var(--ink-1);
            background-image:
                linear-gradient(rgba(214, 224, 236, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(214, 224, 236, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .detail-figure .pcard__glyph { width: 96px; height: 96px; }
        .detail-figure .pcard__metric-value { font-size: clamp(2.4rem, 5vw, 3.4rem); }
        .detail-body {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
            gap: clamp(32px, 6vw, 72px);
            align-items: start;
        }
        .detail-body > * { min-width: 0; }
        .more { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding-top: 24px; border-top: 1px solid var(--line); }
        .more a { display: grid; gap: 4px; max-width: 46%; min-width: 0; }
        .more a:last-child { text-align: right; margin-left: auto; }
        .more .h-card { font-size: 1.0625rem; }
        .more a:hover .h-card { color: var(--brass); }
        @media (max-width: 899px) {
            .detail-hero__grid, .detail-body { grid-template-columns: minmax(0, 1fr); }
        }
        @media (max-width: 599px) {
            .more a { max-width: 100%; }
            .more a:last-child { text-align: left; margin-left: 0; }
        }
    </style>
</head>
<body class="site" data-page="projects" id="top">

    <header data-site-header></header>

    <main id="page-content"></main>

    <footer data-site-footer></footer>

    <script src="../js/portfolio.js"></script>
    <script src="../data/projects.js"></script>
    <script>
        const i18n = {
            en: {
                back: "All projects",
                overview: "Overview",
                highlights: "Key points",
                spec: "Project data",
                org: "Organisation",
                year: "Year",
                domain: "Discipline",
                tools: "Tools",
                prev: "Previous",
                next: "Next",
                not_found_title: "Project not found",
                not_found_p: "The link may be out of date. The full list is on the projects page."
            },
            tr: {
                back: "Tüm projeler",
                overview: "Genel bakış",
                highlights: "Öne çıkanlar",
                spec: "Proje bilgileri",
                org: "Kurum",
                year: "Yıl",
                domain: "Disiplin",
                tools: "Araçlar",
                prev: "Önceki",
                next: "Sonraki",
                not_found_title: "Proje bulunamadı",
                not_found_p: "Bağlantı güncel olmayabilir. Tüm liste projeler sayfasında."
            }
        };
        const esc = PortfolioApp.escapeHtml;
        const ICON_BACK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';

        function renderProject(lang) {
            const t = i18n[lang];
            const id = new URLSearchParams(location.search).get("id");
            const index = projectsData.findIndex((p) => p.id === id);
            const host = document.getElementById("page-content");

            if (index === -1) {
                host.innerHTML = `
                    <section class="hero drafting"><div class="wrap stack">
                        <a class="crumb" href="projects.html">${ICON_BACK}${t.back}</a>
                        <h1 class="h-page">${t.not_found_title}</h1>
                        <p class="lead">${t.not_found_p}</p>
                    </div></section>`;
                document.title = `${t.not_found_title} — Ege Şengöz`;
                return;
            }

            const project = projectsData[index];
            const data = project[lang] || project.en;
            const metric = project.metric || {};
            const org = data.company && data.company !== "-" ? data.company : "";
            const domain = projectDomains[project.domain] ? projectDomains[project.domain][lang] : data.categoryLabel;
            const prev = projectsData[(index - 1 + projectsData.length) % projectsData.length];
            const next = projectsData[(index + 1) % projectsData.length];

            const specRows = [
                org ? [t.org, esc(org)] : null,
                [t.year, esc(project.year)],
                [t.domain, esc(domain)],
                [t.tools, `<div class="chips">${project.tags.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>`]
            ].filter(Boolean).map(([k, v]) => `<div class="spec__row"><dt>${k}</dt><dd>${v}</dd></div>`).join("");

            const checks = data.highlights.map((h, i) =>
                `<li><span class="checks__n">${String(i + 1).padStart(2, "0")}</span><span>${esc(h)}</span></li>`
            ).join("");

            host.innerHTML = `
                <section class="hero drafting" style="padding-bottom:clamp(40px,5vw,64px)">
                    <div class="wrap stack-lg">
                        <a class="crumb" href="projects.html">${ICON_BACK}${t.back}</a>
                        <div class="detail-hero__grid">
                            <div class="stack">
                                <span class="eyebrow">${esc(domain)}</span>
                                <h1 class="h-page">${esc(data.title)}</h1>
                                <p class="lead">${esc(data.subtitle)}</p>
                            </div>
                            <div class="detail-figure">
                                <div class="pcard__metric">
                                    <span class="pcard__metric-value">${esc(metric.value || "")}</span>
                                    <span class="pcard__metric-label">${esc(metric[lang] || "")}</span>
                                </div>
                                <div class="pcard__glyph">${PortfolioApp.glyphSvg(project.glyph)}</div>
                            </div>
                        </div>
                    </div>
                </section>
                <section class="section">
                    <div class="wrap detail-body">
                        <div class="stack-lg">
                            <div class="stack">
                                <span class="eyebrow">${t.overview}</span>
                                <div class="prose"><p>${esc(data.description)}</p></div>
                            </div>
                            <div class="stack">
                                <span class="eyebrow">${t.highlights}</span>
                                <ol class="checks">${checks}</ol>
                            </div>
                        </div>
                        <aside class="stack split__aside">
                            <span class="eyebrow">${t.spec}</span>
                            <dl class="spec" style="margin:0">${specRows}</dl>
                        </aside>
                    </div>
                </section>
                <section style="padding-bottom:clamp(56px,8vw,96px)">
                    <div class="wrap">
                        <nav class="more" aria-label="More projects">
                            <a href="project-detail.html?id=${encodeURIComponent(prev.id)}">
                                <span class="eyebrow">${t.prev}</span>
                                <span class="h-card">${esc((prev[lang] || prev.en).title)}</span>
                            </a>
                            <a href="project-detail.html?id=${encodeURIComponent(next.id)}">
                                <span class="eyebrow">${t.next}</span>
                                <span class="h-card">${esc((next[lang] || next.en).title)}</span>
                            </a>
                        </nav>
                    </div>
                </section>`;
            document.title = `${data.title} — Ege Şengöz`;
            const meta = document.querySelector('meta[name="description"]');
            if (meta) meta.setAttribute("content", data.subtitle);
        }

        PortfolioApp.registerPageTranslations(i18n);
        PortfolioApp.onLanguageChange(renderProject);
    </script>
</body>
</html>
